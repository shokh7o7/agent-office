services:
  agent-office:
    build:
      context: .
      args:
        VITE_API_BASE_URL: https://office.snapeld.com
    container_name: agent-office
    restart: unless-stopped
    env_file: /etc/agent-office.env   # GEMINI_API_KEY lives here, not in the repo
    volumes:
      - agent-office-data:/data
    networks:
      - snapeld_net                   # reached by snapeld-nginx as agent-office:8787

volumes:
  agent-office-data:

networks:
  snapeld_net:
    external: true
    name: snapeld_snapeld_net
