# /etc/nginx/sites-available/office.snapeld.com
# Start with plain HTTP; `certbot --nginx -d office.snapeld.com` then adds
# the 443/TLS block and the HTTP→HTTPS redirect itself.
server {
    listen 80;
    server_name office.snapeld.com;

    location / {
        # Password inside `location /` so certbot's challenge path stays reachable.
        # The backend spends your Gemini quota: keep this.
        auth_basic "Agent Office";
        auth_basic_user_file /etc/nginx/.htpasswd-agent-office;

        proxy_pass http://127.0.0.1:8787;   # if nginx runs in Docker: http://agent-office:8787 on a shared network
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;                 # live task updates (SSE)
        proxy_read_timeout 1h;
    }
}
